name: Build AutoDumperSdk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip (clean)
        run: |
          # Extract ignoring Mac junk and force continue on symlink errors
          unzip -o AutoDumperSdk.zip -x "__MACOSX/*" "*/._*" || true
          rm -rf __MACOSX
          find . -name "._*" -type f -delete || true
          ls -la
          ls -la DumperSdk

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build
        working-directory: DumperSdk
        run: |
          xcodebuild \
            -project SdkDumper.xcodeproj \
            -target SdkDumper \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Locate dylib
        run: find DumperSdk/build -name "SdkDumper.dylib" -type f

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: DumperSdk/build/**/SdkDumper.dylib
          if-no-files-found: error
