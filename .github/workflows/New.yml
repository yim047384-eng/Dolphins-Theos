name: Unzip and Clean Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and Clean
        run: |
          echo "Extracting AutoDumperSdk.zip..."
          # Use Python to avoid symlink errors
          python3 - << 'EOF'
          import zipfile, os, shutil
          z = zipfile.ZipFile("AutoDumperSdk.zip")
          for info in z.infolist():
              name = info.filename
              if name.startswith("__MACOSX") or "/._" in name or name.endswith(".DS_Store"):
                  continue
              try:
                  z.extract(info)
              except Exception as e:
                  print(f"Skipped {name}: {e}")
          print("Extract complete")
          EOF
          
          # Extra cleanup
          rm -rf __MACOSX || true
          find . -name "._*" -type f -delete || true
          find . -name ".DS_Store" -delete || true
          rm -f AutoDumperSdk.zip || true
          
          echo "Final structure:"
          ls -la
          ls -la DumperSdk || echo "DumperSdk missing"

      - name: Commit cleaned files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Extracted and cleaned AutoDumperSdk source"
          git push
