name: Build AutoDumperSdk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Extract
        run: |
          unzip -o AutoDumperSdk.zip
          ls -la DumperSdk

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build
        working-directory: DumperSdk
        run: |
          xcodebuild -project SdkDumper.xcodeproj -target SdkDumper -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO clean build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: DumperSdk/build/**/SdkDumper.dylib
