name: Build AutoDumperSdk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract with pure Python
        run: |
          python3 -c '
          import zipfile, os
          z = zipfile.ZipFile("AutoDumperSdk.zip")
          for info in z.infolist():
              name = info.filename
              if name.startswith("__MACOSX") or "/._" in name or name.endswith(".DS_Store"):
                  continue
              try:
                  z.extract(info)
              except Exception as e:
                  print("Skipped:", name, e)
          print("Done extracting")
          '
          echo "==== Root ===="
          ls -la
          echo "==== DumperSdk ===="
          ls -la DumperSdk || echo "DumperSdk not found"

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build
        working-directory: DumperSdk
        run: |
          xcodebuild \
            -project SdkDumper.xcodeproj \
            -target SdkDumper \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: DumperSdk/build/**/SdkDumper.dylib
