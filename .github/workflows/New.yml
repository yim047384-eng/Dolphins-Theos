name: Build AutoDumperSdk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Zip safely
        run: |
          # Force extract and ignore errors
          unzip -o AutoDumperSdk.zip -x "__MACOSX/*" "*/._*" || true
          # Clean Mac junk
          find . -name "__MACOSX" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "._*" -type f -delete 2>/dev/null || true
          ls -la
          ls -la DumperSdk || echo "DumperSdk folder not found"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build dylib
        run: |
          if [ -d "DumperSdk" ]; then
            cd DumperSdk
          fi
          xcodebuild \
            -project SdkDumper.xcodeproj \
            -target SdkDumper \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Find and upload
        run: find . -name "SdkDumper.dylib" -type f

      - name: Upload SdkDumper.dylib
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: "**/SdkDumper.dylib"
