name: Build AutoDumperSdk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract with Python (ignore errors)
        run: |
          python3 - << 'EOF'
          import zipfile
          import os
          z = zipfile.ZipFile('AutoDumperSdk.zip')
          for info in z.infolist():
              if info.filename.startswith('__MACOSX') or '/._' in info.filename or info.filename.endswith('.DS_Store'):
                  continue
              try:
                  z.extract(info)
              except Exception as e:
                  print(f"Skipped {info.filename}: {e}")
          print("Extract done")
          EOF
          ls -la
          ls -la DumperSdk || echo "No DumperSdk folder"

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build
        working-directory: DumperSdk
        run: |
          xcodebuild \
            -project SdkDumper.xcodeproj \
            -target SdkDumper \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: DumperSdk/build/**/SdkDumper.dylib
