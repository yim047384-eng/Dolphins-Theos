name: Build AutoDumperSdk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip
        run: |
          set +e
          unzip -o AutoDumperSdk.zip -x "__MACOSX/*" "*/._*"
          exit_code=$?
          set -e
          echo "Unzip exit code: $exit_code"
          rm -rf __MACOSX || true
          find . -name "._*" -type f -delete || true
          ls -la
          if [ ! -d "DumperSdk" ]; then
            echo "DumperSdk folder missing!"
            exit 1
          fi

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build
        working-directory: DumperSdk
        run: |
          xcodebuild \
            -project SdkDumper.xcodeproj \
            -target SdkDumper \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Find dylib
        run: find DumperSdk/build -name "SdkDumper.dylib" -type f || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: DumperSdk/build/**/SdkDumper.dylib
