name: Build Dolphins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Debug THEOS path
        run: |
          echo "THEOS = $THEOS"
          ls -la "$THEOS" || echo "THEOS dir missing"
          ls -la "$THEOS/makefiles/common.mk" || echo "common.mk MISSING"

      - name: Build package
        run: |
          make clean || echo "clean failed, continuing"
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Dolphins-deb
          path: packages/*.deb
