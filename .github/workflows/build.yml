name: Build Dolphins Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pre-create Theos SDKs directory
        run: mkdir -p theos/sdks

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'

      - name: Debug THEOS path
        run: |
          echo "THEOS = $THEOS"
          ls -la "$THEOS/makefiles/common.mk" || echo "COMMON.MK MISSING"
          ls -la "$THEOS/makefiles/library.mk" || echo "LIBRARY.MK MISSING"

      - name: Build dylib
        run: |
          make clean || echo "clean skipped"
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Dolphins-dylib
          path: .theos/obj/arm64/Dolphins.dylib
          if-no-files-found: warn
