name: Build Dolphins Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Theos manually
        run: |
          # Clone Theos with submodules
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # Download the iOS SDKs
          curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          
          # Move the SDKs into the Theos directory
          mkdir -p $HOME/theos/sdks
          mv /tmp/sdks-master/*.sdk $HOME/theos/sdks/
          
          # Export THEOS so your Makefile can see it
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Debug THEOS path
        run: |
          echo "THEOS = $THEOS"
          ls -la "$THEOS/makefiles/common.mk" || echo "COMMON.MK MISSING"
          ls -la "$THEOS/makefiles/library.mk" || echo "LIBRARY.MK MISSING"

      - name: Build dylib
        run: |
          make clean || echo "clean skipped"
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Dolphins-dylib
          path: .theos/obj/arm64/Dolphins.dylib
          if-no-files-found: warn
