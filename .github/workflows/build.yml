name: Build SdkDumper (deb + dylib)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build
        working-directory: Theos-SdkDumper
        run: |
          make clean || true
          make package

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-deb
          path: Theos-SdkDumper/**/*.deb

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: Theos-SdkDumper/.theos/obj/arm64/*.dylib
