name: Build AutoDumperSdk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Set THEOS env
        run: echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid || true

      - name: Build .deb package
        run: |
          make package FINALPACKAGE=1 THEOS=${{ github.workspace }}/theos
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles

      - name: Extract .dylib from .deb
        run: |
          DEB=$(find packages -name "*.deb" | head -1)
          echo "Found deb: $DEB"
          mkdir -p deb_extract
          dpkg-deb -x "$DEB" deb_extract
          find deb_extract -name "*.dylib" | head -5
          mkdir -p dylib_out
          find deb_extract -name "*.dylib" -exec cp {} dylib_out/ \;

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDumperSdk-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDumperSdk-dylib
          path: dylib_out/*.dylib
          if-no-files-found: warn
          retention-days: 14
