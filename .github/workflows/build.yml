name: Build SdkDumper dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Build
        working-directory: DumperSdk
        run: |
          xcodebuild \
            -project SdkDumper.xcodeproj \
            -target SdkDumper \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_SEARCH_USER_PATHS=NO \
            clean build

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: DumperSdk/build/**/SdkDumper.dylib
          if-no-files-found: error
