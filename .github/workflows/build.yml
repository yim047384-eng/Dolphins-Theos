name: Theos Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Build tweak
        working-directory: "working-directory: "FUCK-IOS-DEV-extracted/FUCK IOS DEV"
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Theos-Build
          path: FUCK-IOS-DEV-extracted/FUCK IOS DEV/.theos/obj/**/*.dylib


