name: Build Dolphins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pre-create Theos SDKs directory
        run: mkdir -p theos/sdks

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'

      - name: Build package
        run: |
          make clean || echo "clean failed, continuing"
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Dolphins-deb
          path: packages/*.deb
