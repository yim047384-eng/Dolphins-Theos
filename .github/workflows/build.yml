
name: iOS Dylib Compile Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Compile dylib
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang++ \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            FUCK-IOS-DEV-extracted/FUCK IOS DEV/ImGuiDrawView.mm \
            -o build/CustomLibrary.dylib


