

name: Test Source Files

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source folder
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="FUCK-IOS-DEV-extracted/FUCK IOS DEV"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Source folder not found"
            exit 1
          fi

          echo "Source folder found"

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="FUCK-IOS-DEV-extracted/FUCK IOS DEV"

          for FILE in \
            "ImGuiDrawView.mm" \
            "Makefile" \
            "Make.sh" \
            "SDK.hpp" \
            "Iconcpp.h"
          do
            if [ -f "$SOURCE_DIR/$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "MISSING: $FILE"
            fi
          done

      - name: List source directories
        run: |
          find "FUCK-IOS-DEV-extracted/FUCK IOS DEV" \
            -maxdepth 2 -type d
