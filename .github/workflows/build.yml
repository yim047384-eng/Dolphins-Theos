
name: Build iOS Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib
        run: |
          mkdir -p build

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -o build/CustomLibrary.dylib \
            FUCK-IOS-DEV-extracted/FUCK IOS DEV/ImGuiDrawView.mm

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Dylib
          path: build/CustomLibrary.dylib
