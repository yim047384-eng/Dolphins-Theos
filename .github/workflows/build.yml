name: Build Dolphins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'

      - name: Debug THEOS (critical)
        run: |
          echo "THEOS = $THEOS"
          echo "--- checking common.mk ---"
          ls -la "$THEOS/makefiles/common.mk" || echo "COMMON.MK MISSING!"
          echo "--- checking tweak.mk ---"
          ls -la "$THEOS_MAKE_PATH/tweak.mk" || echo "TWEAK.MK MISSING!"
          echo "--- listing THEOS root ---"
          ls -la "$THEOS" | head -20

      - name: Build package
        run: |
          make clean || echo "clean failed, continuing"
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Dolphins-deb
          path: packages/*.deb
