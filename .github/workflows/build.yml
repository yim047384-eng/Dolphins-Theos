name: Build SdkDumper (deb + dylib)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup Xcode SDK
        run: |
          mkdir -p $HOME/theos/sdks
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -sf "$SDK_PATH" $HOME/theos/sdks/iPhoneOS.sdk

      - name: Install ldid
        run: |
          brew install ldid || true
          if ! command -v ldid &> /dev/null; then
            curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64 -o /usr/local/bin/ldid
            chmod +x /usr/local/bin/ldid
          fi

      - name: Build
        working-directory: Theos-SdkDumper
        run: |
          make clean || true
          make package

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-deb
          path: Theos-SdkDumper/**/*.deb
          if-no-files-found: warn

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: Theos-SdkDumper/.theos/obj/**/*.dylib
          if-no-files-found: warn
