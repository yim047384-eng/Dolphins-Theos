name: Build SdkDumper (deb + dylib)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # Install Theos without SDK
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup Xcode SDK for Theos
        run: |
          mkdir -p $HOME/theos/sdks
          # Use Xcode's iPhoneOS SDK
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          ln -sf "$SDK_PATH" $HOME/theos/sdks/iPhoneOS.sdk
          ls -la $HOME/theos/sdks/

      - name: Build
        working-directory: Theos-SdkDumper
        run: |
          make clean || true
          make package

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-deb
          path: Theos-SdkDumper/**/*.deb
          if-no-files-found: warn

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SdkDumper-dylib
          path: Theos-SdkDumper/.theos/obj/**/*.dylib
          if-no-files-found: warn
