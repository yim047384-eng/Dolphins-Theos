name: Build SDKGenerator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid & GNU utils
        run: |
          brew install ldid gnu-tar || true

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ github.workspace }}/theos

           - name: Download Theos SDKs
        run: |
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip || true
          rsync -a sdks-master/ $THEOS/sdks/
          ls $THEOS/sdks/
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Set THEOS env
        run: |
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=${{ github.workspace }}/theos/makefiles" >> $GITHUB_ENV

      - name: Build package
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles

      - name: Extract dylib from deb
        run: |
          DEB=$(find packages -name "*.deb" | head -1)
          if [ -n "$DEB" ]; then
            mkdir -p dylib_out deb_extract
            dpkg-deb -x "$DEB" deb_extract
            find deb_extract -name "*.dylib" -exec cp {} dylib_out/ \;
          fi

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SDKGenerator-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SDKGenerator-dylib
          path: dylib_out/*.dylib
          if-no-files-found: warn
          retention-days: 14
