name: Build SDKGenerator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Set THEOS env
        run: echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid || true

      - name: Build
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles

      - name: Extract dylib
        run: |
          DEB=$(find packages -name "*.deb" | head -1)
          mkdir -p dylib_out
          dpkg-deb -x "$DEB" deb_extract
          find deb_extract -name "*.dylib" -exec cp {} dylib_out/ \;

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SDKGenerator-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SDKGenerator-dylib
          path: dylib_out/*.dylib
          if-no-files-found: warn
          retention-days: 14
